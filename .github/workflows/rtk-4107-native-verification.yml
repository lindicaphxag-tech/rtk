name: Independent native Rust proof for rtk PR 4107

on:
  push:
    branches:
      - verification/rtk-4107-cpu-native-ci-20261121
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rtk-grep-recall:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rust source format
        run: cargo fmt --all -- --check
      - name: Assert library actually discovers the target tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib streaming_search_ -- --list | tee /tmp/rtk-4107-tests.txt
          n=$(grep -cE 'streaming_search_.*: test' /tmp/rtk-4107-tests.txt || true)
          echo "Discovered $n streaming search regression tests"
          test "$n" -ge 4
      - name: Execute actual streaming grep cap recovery regressions
        run: cargo test --locked --lib streaming_search_ -- --nocapture
      - name: Verify cli integration shell syntax
        run: bash -n hooks/claude/rtk-rewrite.sh
